<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Practice Lecture 1 Operators</title>
  </head>
  <body>
    <!-- Relational Operators -->

    <script>
      // ==   is equal to (For Comparison)
      // ===  is equal to (For Comparison and DataType Also)
      // <    lower Then
      // >    grator Then
      // <=   lower Then equal to
      // >=   grator Then equal to

      // Example :

      let a = 5;
      let b = 10;

      if (a == b) {
        console.log("If is Working");
      } else if (a < b) {
        console.log("Else If is Working");
      }
    </script>

    <!-- Logical Operator -->

    <script>
      // &&   And Operator
      // ||   Or Operator
      // !    Not Operator
      // !=   Not equal to
      // !==  Not equal to (For DataType)

      // Example :

      let x = 5;
      let d = 5;
      let e = 10;
      let f = 10;

      if (x == d && e === f) {
        console.log("If is Working");
      } else if (e >= f && d <= x) {
        console.log("Else If is Working");
      }
    </script>

    <!-- Arithmetic Operator -->

    <script>
      // +    Addition
      // -    Substracion
      // *    Multiplication
      // /    Division
      // %    Percentage

      // Example :

      let p = 2;
      let r = 35;

      if (p < r || p == r) {
        console.log(r * p);
      }
    </script>
  </body>
</html>
