<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Practice Lecture 1 DataTypes</title>
  </head>
  <body>
    <script>
      // Data Types Practice

      // 1 (Number)

      var x = 5;

      console.log(typeof x);

      // 2 (String)

      var x = "Ahsan";

      console.log(typeof x);

      // 3 (boolean)

      var x = true;

      console.log(typeof x);

      // 4 (Undefined)

      var y;

      console.log(typeof y);

      // 5 (Object)

      var z = { firstName: "Ahsan", lastName: "Ikram" };

      console.log(typeof z);

      // 6 (Array Object)

      var a = ["Ahsan", "Ikram"];

      console.log(typeof a);
    </script>
  </body>
</html>
