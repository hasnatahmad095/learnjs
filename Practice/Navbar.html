<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofadi+One&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: #000;
            padding: 30px 20px;
        }

        .dflex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo,
        button img {
            width: 40px;
        }

        button {
            background: #fff;
            padding: 16px 30px;
            cursor: pointer;
            box-shadow: none;
            border: none;
            z-index: 999999;
            font-size: 20px;
            font-weight: 600;
            position: relative;
        }

        .logo img {
            width: 100%;
            object-fit: contain;
        }

        #navigation {
            position: fixed;
            left: -100%;
            width: 400px;
            height: 100%;
            top: 0;
            box-shadow: 0px 0px 15px 0px #000;
            padding: 150px 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            transition: 0.8s all ease-in-out;
        }


        #navigation.shownavbar {
            left: 0;
            transition: 0.8s all ease-in-out;
        }

        #navigation ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
            line-height: 28px;
            font-family: "Sofadi One", system-ui;
            font-weight: 400;
            font-style: normal;
            transition: 0.5s all ease-in-out;
        }

        #navigation ul li a:hover {
            color: #000;
            transition: 0.5s all ease-in-out;
        }

        #navigation ul li {
            margin-bottom: 20px;
            list-style: none;
        }

        #togglemenu {
            color: #000;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="dflex">
                <div class="logo">
                    <img src="../public/logo.png" alt="">
                </div>
                <div class="menu">
                    <nav id="navigation">
                        <ul>
                            <li>
                                <a href="#.">Home</a>
                            </li>
                            <li>
                                <a href="#.">About</a>
                            </li>
                            <li>
                                <a href="#.">Services</a>
                            </li>
                            <li>
                                <a href="#.">Blog</a>
                            </li>
                            <li>
                                <a href="#.">Contact</a>
                            </li>
                        </ul>
                    </nav>
                    <button id="togglemenu">
                        <!-- <img src="../public/menu.svg" alt=""> -->
                        Menu
                    </button>
                </div>
            </div>
        </div>
    </header>


    <script>
        const nav = document.getElementById("navigation");
        const button = document.getElementById("togglemenu");

        button.addEventListener("click", () => {

            if (nav.classList.contains("shownavbar")) {
                nav.classList.remove("shownavbar");
            }
            else { nav.classList.add("shownavbar") };
        });
    </script>
</body>

</html>
