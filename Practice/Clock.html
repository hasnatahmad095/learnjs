<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            background: #000;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .clock {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            cursor: pointer;
        }

        /* .clock {
            position: absolute;
            content: '';
            background: url(../public/apple.png) no-repeat;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            width: 100%;
            height: 100%;
        } */

        .clock img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: fixed;
            left: 0;
            right: 0;
            margin: 0 auto;
            z-index: 0;
        }

        #clockText {
            color: #fff;
            font-size: 6vw;
            z-index: 99;
            transition: 0.5s all ease-in-out;
        }
    </style>
</head>

<body>
    <div class="clock">
        <img src="../public/apple.png" />
        <span id="clockText" style="opacity: 0; visibility: visible;"></span> <!-- Initially hidden -->
    </div>

    <script>
        function timerclock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');

            hours = hours % 12;
            hours = hours ? hours : 12;
            hours = hours.toString().padStart(2, '0');

            document.getElementById('clockText').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(timerclock, 1000);

        timerclock();

        document.querySelector('.clock').addEventListener('click', function () {
            const clockText = document.getElementById('clockText');

            clockText.style.opacity = '1';
            clockText.style.visibility = 'visible';

            setTimeout(() => {
                clockText.style.opacity = '0';
                clockText.style.visibility = 'hidden';
            }, 2000);
        });
    </script>


</body>

</html>
