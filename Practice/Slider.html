<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <style>
        .slider-container {
            width: 900px;
            height: 500px;
            overflow: hidden;
            position: relative;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 500px;
        }

        .btn-container {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .prev-btn,
        .next-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="slider-container">
        <div class="slides">
            <div class="slide" style="background-color: lightcoral">Slide 1</div>
            <div class="slide" style="background-color: lightseagreen">Slide 2</div>
            <div class="slide" style="background-color: lightblue">Slide 3</div>
            <div class="slide" style="background-color: lightgoldenrodyellow">
                Slide 4
            </div>
        </div>
        <div class="btn-container">
            <button class="prev-btn">Prev</button>
            <button class="next-btn">Next</button>
        </div>
    </div>
    <script>
        const slides = document.querySelector(".slides");
        const slide = document.querySelectorAll(".slide");
        const prevBtn = document.querySelector(".prev-btn");
        const nextBtn = document.querySelector(".next-btn");
        let currentSlide = 0;
        const totalSlides = slide.length;
        function updateSlidePosition() {
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        nextBtn.addEventListener("click", () => {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSlidePosition();
        });
        prevBtn.addEventListener("click", () => {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateSlidePosition();
        });
    </script>
</body>

</html>
