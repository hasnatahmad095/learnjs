<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      // =================================== push() and pop()========================================
      // push(): Adds one or more elements to the end of an array and returns the new length of the array.
      // pop(): Removes the last element from an array and returns that element

      // let arr = [1, 2, 3];
      // arr.push(4);
      // arr is now[1, 2, 3, 4]
      // arr.pop();
      // arr is now[1, 2, 3]

      // =====================================shift() and unshift()====================================
      // shift(): Removes the first element from an array and returns that element.
      // unshift(): Adds one or more elements to the beginning of an array and returns the new length of the array.

      // let arr = [1, 2, 3];
      // arr.shift();
      // arr is now [2, 3]
      // arr.unshift(0);
      // arr is now [0, 2, 3]

      // =======================================concat()================================================
      // Combines two or more arrays into a new array.

      // let arr1 = [1, 2];
      // let arr2 = [3, 4];
      // let arr3 = arr1.concat(arr2);
      // arr3 is [1, 2, 3, 4]

      // ========================================slice()=============================================
      // Returns a shallow copy of a portion of an array into a new array object selected from start to end(end not included).

      // let arr = [1, 2, 3, 4];
      // let newArr = arr.slice(1, 3);
      // newArr is[2, 3]

      // ========================================splice()===============================================
      // Changes the contents of an array by removing, replacing, or adding elements

      // let arr = [1, 2, 3, 4];
      // arr.splice(1, 2, 'a', 'b');
      // arr is now [1, 'a', 'b', 4]

      // ========================================forEach()=============================================
      // Executes a provided function once for each array element.

      // let arr = [1, 2, 3];
      // arr.forEach(element => console.log(element));
      // Output: 1, 2, 3

      // =========================================map()================================================
      // Creates a new array populated with the results of calling a provided function on every element in the calling array.

      // let arr = [1, 2, 3];
      // let newArr = arr.map(x => x * 2);
      // newArr is [2, 4, 6]

      // ========================================filter()=============================================
      // Creates a new array with all elements that pass the test implemented by the provided function

      // let arr = [1, 2, 3, 4];
      // let filteredArr = arr.filter(x => x > 2);
      // filteredArr is [3, 4]

      // =======================================reduce()===============================================
      // let arr = [1, 2, 3, 4];
      // let sum = arr.reduce((accumulator, currentValue) => accumulator + currentValue, 0);
      // sum is 10

      // ==================================find() and findIndex()======================================
      // find(): Returns the value of the first element in the array that satisfies the provided testing function.
      // findIndex(): Returns the index of the first element in the array that satisfies the provided testing function.

      // let arr = [1, 2, 3, 4];
      // let found = arr.find(x => x > 2);
      // found is 3
      // let foundIndex = arr.findIndex(x => x > 2);
      // foundIndex is 2

      // ======================================includes()=============================================
      // Determines whether an array includes a certain value among its entries, returning true or false as appropriate.

      // let arr = [1, 2, 3];
      // let hasTwo = arr.includes(2);
      // hasTwo is true

      // =========================================sort()==============================================
      // Sorts the elements of an array in place and returns the sorted array.

      // let arr = [3, 1, 2];
      // arr.sort();
      // arr is now [1, 2, 3]

      // ======================================reverse()=============================================
      // Reverses the order of the elements in an array.

      // let arr = [1, 2, 3];
      // arr.reverse();
      // arr is now [3, 2, 1]
    </script>
  </body>
</html>
