<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let x = 5;
      let random = Math.random() * x;
      console.log(random, "random");

      let randomValue = Math.round(Math.random() * x);
      console.log(randomValue, "randomValue");

      // Math.floor() rounds off down
      // Math.ceil() rounds off upp
    </script>
  </body>
</html>
