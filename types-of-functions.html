<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // ========================================================================================================================================
        //  Function Declaration
        //  A Function Declaration defines a named function that can be invoked by name.
        //     Example
        // function greet(name) {
        //     return `Hello, ${name}!`;
        // }
        // console.log(greet("Alice"));
        // Output: Hello, Alice!

        // Details:
        // Hoisting: Function declarations are hoisted, meaning they can be called before they are defined in the code.
        // Named Function: The function has a name(greet), which makes it easy to call and reference.
        // Scope: The function is defined in the current scope(global or local).


        // ========================================================================================================================================
        // Function Expression
        // A Function Expression defines a function inside an expression, typically assigned to a variable.
        // Example
        // const greet = function(name) {
        // return `Hello, ${name}!`;
        // };
        // console.log(greet("Bob"));
        // Output: Hello, Bob!

        // Details:
        // Not Hoisted: Unlike function declarations, function expressions are not hoisted, so they cannot be called before they are defined.
        // Anonymous or Named: The function can be anonymous or named (though it's often anonymous).
        // Use Case: Commonly used when passing functions as arguments or returning functions from other functions.


        // ========================================================================================================================================
        // Arrow Function
        // An Arrow Function is a shorter syntax for writing function expressions, with lexical binding of this.
        // Example
        // const greet = (name) => `Hello, ${name}!`;
        // console.log(greet("Charlie"));
        // Output: Hello, Charlie!

        // Details:
        // Short Syntax: More concise than traditional function expressions, especially for single-line functions.
        // Lexical this: this inside an arrow function is inherited from the surrounding context, unlike in regular functions.
        // No arguments object: Arrow functions do not have their own arguments object.


        // ========================================================================================================================================
        // Anonymous Function
        // An Anonymous Function is a function without a name, often used where functions are passed as arguments.
        // Example
        // setTimeout(function() {
        // console.log("This is an anonymous function!");
        // }, 1000);

        // Details:
        // No Name: The function does not have a name, making it suitable for scenarios where it doesn’t need to be referenced elsewhere.
        // Use Case: Commonly used in event handlers, callbacks, and IIFEs.


        // ========================================================================================================================================
        //    Immediately Invoked Function Expression (IIFE)
        //    An IIFE is a function that is executed immediately after it is defined.
        //    Example:
        //    (function() {
        //    console.log("This is an IIFE!");
        //    })();

        //    Details:
        //    Execution: The function is invoked immediately after its definition.
        //    Encapsulation: Often used to create a private scope, preventing variables from polluting the global scope.
        //    Syntax: The function is wrapped in parentheses to treat it as an expression, followed by () to invoke it.


        // ========================================================================================================================================
        // Higher - Order Function
        // A Higher - Order Function is a function that takes another function as an argument or returns a function.
        // Example:
        // function higherOrder(fn) {
        //     return function (name) {
        //         return fn(name);
        //     };
        // }
        // const greet = higherOrder(function (name) {
        //     return `Hello, ${name}!`;
        // });
        // console.log(greet("Dave")); // Output: Hello, Dave!

        // Details:
        // Takes / Returns Functions: These functions operate on other functions by taking them as arguments or returning them.
        // Use Case: Commonly used in functional programming, array methods like map, filter, reduce are examples.


        // ========================================================================================================================================
        // Constructor Function
        // A Constructor Function is used to create objects with similar properties and methods.
        // Example:
        // function Person(name, age) {
        //     this.name = name;
        //     this.age = age;
        // }
        // const person1 = new Person("Eve", 25);
        // console.log(person1.name);
        // Output: Eve

        // Details:
        // new Keyword: Used with the new keyword to create a new instance of an object.
        // this Binding: Inside a constructor, this refers to the new object being created.
        // Prototypes: Methods are typically added to the constructor's prototype to be shared across instances.


        // ========================================================================================================================================
        // Generator Function
        // A Generator Function allows you to pause and resume execution using yield.
        //     Example:
        // function* numberGenerator() {
        //     yield 1;
        //     yield 2;
        //     yield 3;
        // }

        // const gen = numberGenerator();
        // console.log(gen.next().value);
        // Output: 1
        // console.log(gen.next().value);
        // Output: 2
        // Details:
        // Pause and Resume: The function can be paused with yield and resumed with next().
        // Iterator: Returns an iterator object that can be used to traverse values one by one.
        // Stateful: Useful for managing state in iterative processes.



        // ========================================================================================================================================
        // Async Function
        //  An Async Function is a function that returns a Promise and allows the use of await for asynchronous code.

        //     Example:
        //     async function fetchData() {
        //         const response = await fetch('https://api.example.com/data');
        //         const data = await response.json();
        //         return data;
        //     }
        // fetchData().then(data => console.log(data));

        // Details:
        //  Asynchronous Code: Provides a cleaner way to handle asynchronous operations using await.
        //  Returns a Promise: Automatically wraps the returned value in a Promise.
        // Error Handling: Can use try...catch for error handling in asynchronous code.


        // ========================================================================================================================================
        //     Callback Function
        //      A Callback Function is a function passed into another function as an argument and executed after some operation is completed.

        //     Example:
        // function fetchData(callback) {
        //     setTimeout(() => {
        //         const data = { name: "Frank", age: 30 };
        //         callback(data);
        //     }, 1000);
        // }

        // fetchData(function (data) {
        //     console.log(data);
        //     Output: { name: "Frank", age: 30 }
        // });

        // Details:
        // Asynchronous: Commonly used in asynchronous programming to execute code after a task is completed.
        // Passed as an Argument: Passed to another function and executed later.
        //      Error Handling: Typically includes an error - first pattern in Node.js(e.g., callback(err, result)).


        // ========================================================================================================================================
        // Recursive Function
        // A Recursive Function is a function that calls itself to solve a problem.

        // Example:
        // function factorial(n) {
        //   if (n <= 1) return 1;
        //   return n * factorial(n - 1);
        // }
        // console.log(factorial(5)); 
        // Output: 120
        
        // Details:
        // Self-Referential: The function calls itself with a different argument to solve a problem.
        // Base Case: Important to define a base case to stop recursion and avoid infinite loops.
        // Use Case: Commonly used for problems that can be divided into similar sub-problems (e.g., factorial, Fibonacci sequence).

    </script>
</body>

</html>
