<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For-Of Loop Example</title>
    <style>
        .card {
            width: 100px;
            height: 100px;
            background-color: lightgray;
            margin: 10px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .highlight {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <button id="highlightButton">Highlight Cards</button>

    <script>

        // Using classList methods allows you to dynamically control the appearance of
        // individual elements by adding or removing CSS classes. The for-of loop is a
        // powerful tool for iterating over collections of elements, making it easy to
        // apply changes to multiple items in the DOM. Together, they enable flexible 
        // and interactive web design.
        
        const highlightButton = document.getElementById('highlightButton');
        const cards = document.querySelectorAll('.card');

        highlightButton.addEventListener('click', () => {
            for (const card of cards) {
                card.classList.add('highlight');
            }
        });
    </script>
</body>
</html>
