<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch API</title>
  </head>
  <body>
    <h2>Fetch API</h2>
    <p>The Fetch API provides a modern way to make HTTP requests. It returns a Promise that resolves to the response of the request.</p>
    
    <h3>Basic Fetch Example</h3>
    <p>Fetching data from a public API:</p>
    <script>
      fetch('https://jsonplaceholder.typicode.com/posts/1')
        .then(response => response.json())
        .then(data => console.log(data))
        .catch(error => console.error('Error:', error));
    </script>
    
    <h3>Async/Await Example</h3>
    <p>Using async/await for cleaner code:</p>
    <script>
      async function fetchData() {
        try {
          let response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
          let data = await response.json();
          console.log(data);
        } catch (error) {
          console.error('Error:', error);
        }
      }
      fetchData();
    </script>
    
    <h3>Error Handling</h3>
    <p>Checking for response status:</p>
    <script>
      async function fetchWithErrorHandling() {
        try {
          let response = await fetch('https://jsonplaceholder.typicode.com/invalid-url');
          if (!response.ok) {
            throw new Error(`HTTP Error! Status: ${response.status}`);
          }
          let data = await response.json();
          console.log(data);
        } catch (error) {
          console.error('Fetch Error:', error);
        }
      }
      fetchWithErrorHandling();
    </script>
  </body>
</html>
