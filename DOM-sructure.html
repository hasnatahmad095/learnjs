      // The Document Object Model(DOM) is a programming interface that allows you to interact
      // with and manipulate the structure, content, and style of web documents(usually HTML or XML).
      // When a web page is loaded, the browser creates a DOM of the page, which is a tree - like
      // structure where every element on the page(such as headings, paragraphs, links, etc.) is
      //  represented as a node.

      //     Understanding the DOM Structure

      //     01-Tree Structure:
      //    - The DOM is a hierarchical structure,(he DOM (Document Object Model) is indeed a hierarchical
      //      structure, which means it is organized in a tree-like format where elements are nested within one
      //      another in a parent-child relationship.)  resembling a tree, where each node represents part
      //      of the document. The topmost node is the "document" object, and it branches out to include
      //      all the elements (e.g., <html>, <body>, <div>, etc.).
      //    - Parent-Child Relationship: Elements can be parents, children, or siblings. For example,
      //      the <body> element is a parent of the <div> element, and two <div> elements inside the
      //      same <body> are siblings.

      // <!DOCTYPE html>
      //     <html>

      //         <body>
      //             <h1>Hello, World!</h1>
      //             <p>This is a paragraph.</p>
      //         </body>
      //     </html>

      // In the above HTML, the <html> tag is the root of the tree, <head> and <body> are children of <html>, and <h1> and <p> are children of <body>.

      //      02 - Node Types:
      //    -Element Nodes: Represent HTML elements like < div >, <p>, <a>, etc.
      //     Text Nodes: Contain the text content inside an element.
      //     Attribute Nodes: Represent the attributes of an HTML element (like class, id, href).
      //     Comment Nodes: Represent HTML comments (<!-- comment -->).
