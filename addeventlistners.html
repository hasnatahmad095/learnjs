<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addEventListeners and classlists</title>
    <style>
        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div id="myDiv">Click the button to toggle highlight.</div>
    <button id="toggleButton">Toggle Highlight</button>

    <script>

        // addEventListener: Implementing Event Listeners
        // The addEventListener method in JavaScript is used to attach an event handler to an HTML element.
        // An event handler is a function that gets called whenever a specific event occurs on an element
        // (like a click, mouseover, key press, etc.).

        // Basic synytax
        // element.addEventListener(event, function, useCapture);


        const div = document.getElementById('myDiv');
        const button = document.getElementById('toggleButton');

        button.addEventListener('click', () => {
            // Check if the div already has the 'highlight' class
            if (div.classList.contains('highlight')) {
                // Remove the 'highlight' class if it's there
                div.classList.remove('highlight');
            } else {
                // Add the 'highlight' class if it's not there
                div.classList.add('highlight');
            }
        });
    </script>
</body>

</html>
