<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Element JS</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        padding: 0px 14px;
      }
    </style>
  </head>

  <body>
    <script>
      // Header Start Here

      let x = document.createElement("header");
      x.style.width = "100%";
      x.style.backgroundColor = "#000";
      x.style.position = "absolute";
      x.style.left = "0px";
      x.style.right = "0px";
      x.style.padding = "20px 0px";
      document.body.appendChild(x);

      // Container
      let Boxed = document.createElement("div");
      Boxed.setAttribute("class", "container");
      Boxed.style.display = "flex";
      Boxed.style.alignItems = "center";
      Boxed.style.justifyContent = "space-between";
      x.appendChild(Boxed);

      // Logo
      let logo = document.createElement("img");
      logo.setAttribute(
        "src",
        "https://w7.pngwing.com/pngs/643/143/png-transparent-nextjs-hd-logo.png"
      );
      Boxed.appendChild(logo);
      logo.style.objectFit = "contain";
      logo.style.width = "70px";

      // Unordered List
      let ul = document.createElement("ul");
      ul.style.padding = "0px";
      ul.style.margin = "0px";
      ul.style.display = "flex";
      ul.style.gap = "20px";
      Boxed.appendChild(ul);

      // Lists
      let listOne = document.createElement("li");
      listOne.innerText = "Home";
      ul.appendChild(listOne);
      listOne.style.color = "white";
      listOne.style.listStyle = "none";

      let listTwo = document.createElement("li");
      listTwo.innerText = "About";
      ul.appendChild(listTwo);
      listTwo.style.color = "white";
      listTwo.style.listStyle = "none";

      let listThree = document.createElement("li");
      listThree.innerText = "Services";
      ul.appendChild(listThree);
      listThree.style.color = "white";
      listThree.style.listStyle = "none";

      let listFour = document.createElement("li");
      listFour.innerText = "Contact";
      ul.appendChild(listFour);
      listFour.style.color = "white";
      listFour.style.listStyle = "none";

      // Header Close Here

      // Banner Section Start Here

      let banner = document.createElement("section");
      banner.setAttribute("class", "BannerSection");
      banner.style.height = "100vh";
      document.body.appendChild(banner);

      let bannerImage = document.createElement("img");
      bannerImage.setAttribute("src", "public/BannerNew.jpg");
      bannerImage.style.width = "100%";
      bannerImage.style.height = "100%";
      bannerImage.style.objectFit = "cover";
      bannerImage.style.display = "block";
      banner.appendChild(bannerImage);

      // Banner Section Close

      // About Section Start

      let aboutSection = document.createElement("section");
      aboutSection.setAttribute("class", "aboutSection");
      aboutSection.style.padding = "60px 0px";
      document.body.appendChild(aboutSection);

      let boundry = document.createElement("div");
      boundry.setAttribute("class", "container");
      boundry.style.display = "flex";
      boundry.style.alignItems = "center";
      boundry.style.justifyContent = "space-between";
      aboutSection.appendChild(boundry);

      let LeftBox = document.createElement("div");
      LeftBox.style.width = "48%";
      boundry.appendChild(LeftBox);

      let aboutimage = document.createElement("img");
      aboutimage.setAttribute("src", "public/banner.jpg");
      aboutimage.style.width = "100%";
      aboutimage.style.height = "100%";
      aboutimage.style.display = "block";
      aboutimage.style.objectFit = "cover";
      LeftBox.appendChild(aboutimage);

      let RightBox = document.createElement("div");
      RightBox.style.width = "48%";
      boundry.appendChild(RightBox);

      let aboutheading = document.createElement("h1");
      aboutheading.textContent = "About Heading";
      aboutheading.style.fontSize = "40px";
      aboutheading.style.margin = "0px";
      RightBox.appendChild(aboutheading);

      let aboutparagraph = document.createElement("p");
      aboutparagraph.textContent =
        "Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam consequuntur error deserunt ipsa iste ab itaque temporibus deleniti incidunt minima, quos dolor voluptate eos cupiditate ipsam officiis quibusdam necessitatibus facilis.";
      aboutparagraph.style.lineHeight = "1.5";
      RightBox.appendChild(aboutparagraph);

      let aboutbutton = document.createElement("a");
      aboutbutton.setAttribute("href", "#.");
      aboutbutton.innerText = "Learn More";
      aboutbutton.style.background = "#000";
      aboutbutton.style.padding = "12px 30px";
      aboutbutton.style.color = "white";
      aboutbutton.style.borderRadius = "10px";
      RightBox.appendChild(aboutbutton);

      // About Section Close
    </script>
  </body>
</html>
