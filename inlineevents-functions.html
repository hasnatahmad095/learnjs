<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline Events & Function Declaration</title>
    <style>
      .btn {
        width: 50px;
        height: 50px;
        background-color: yellow;
        border-radius: 50%;
      }

      .active {
        background-color: purple;
      }
    </style>
    <!-- onclick="toggle()"
       -->
  </head>

  <body>
    <button class="btn" onmouseover="mouse(this)"></button>

    <script>

      let btn = document.getElementsByClassName("btn");
      console.log(btn, "btn");

    //   function chngecolor() {

    //     btn[0].classList.add("active")
    //   }

    //   function toggle() {
    //     btn[0].style.backgroundColor = "red";
    //   }

    //   function toggle() {
    //     btn[0].classList.toggle("active");
    //   }

      function mouse(element) {
        element.classList.toggle("active");
      }
    </script>
  </body>
</html>
