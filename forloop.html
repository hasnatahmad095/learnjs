    <script>
      // For Loop

      // let val = "";

      // let n = "Hello";

      // for (let i = 0; i < 30; i++) {
      //     // n = n + i;
      //     document.write(n);
      //     // console.log(n);
      // }

      let n = 5; // row or column count
      // defining an empty string
      let string = "";

      for (let i = 0; i < n; i++) {
        // external loop
        for (let j = 0; j < n; j++) {
          // internal loop
          if (i === 0 || i === n - 1) {
            string += "*";
          } else {
            if (j === 0 || j === n - 1) {
              string += "*";
            } else {
              string += " ";
            }
          }
        }
        // newline after each row
        string += "\n";
      }
      // printing the string
      console.log(string);
    </script>
